spring:
  application:
    name: service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/skinlog?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

app:
  jwt:
    # 32바이트 이상. 반드시 환경변수로 주입한다 (코드·레포에 넣지 않는다).
    secret: ${JWT_SECRET:}
    access-token-minutes: 30
    refresh-token-days: 14
    cookie-secure: ${COOKIE_SECURE:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
